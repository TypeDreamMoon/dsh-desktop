# Fork-owned build and release pipeline.
#
# The upstream CI validates and packages on every push, but it never uploads
# artifacts or publishes a release. This workflow gives a self-maintained fork
# downloadable installers and a GitHub Release whose assets the desktop updater
# can consume when `releaseSource` is `github:<owner>/<repo>`.
#
# Guarded to one repository so a future upstream merge cannot start publishing
# from anywhere-labs/dsh-desktop.
name: Fork release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Edition to build
        type: choice
        options: [both, stable, beta]
        default: both
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: fork-release-${{ github.ref }}
  cancel-in-progress: false

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  # A tag builds only the edition it names; a manual run builds the requested
  # edition(s). This keeps a stable tag's release free of beta installers.
  target:
    if: github.repository == 'TypeDreamMoon/dsh-desktop'
    runs-on: ubuntu-latest
    outputs:
      editions: ${{ steps.resolve.outputs.editions }}
    steps:
      - id: resolve
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_CHANNEL: ${{ github.event.inputs.channel }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            channel="$INPUT_CHANNEL"
          elif [[ "$REF_NAME" == *"-beta."* ]]; then
            channel="beta"
          else
            channel="stable"
          fi
          case "$channel" in
            stable) echo 'editions=["dsh-plugin-desktop"]' >> "$GITHUB_OUTPUT" ;;
            beta) echo 'editions=["dsh-plugin-desktop-beta"]' >> "$GITHUB_OUTPUT" ;;
            *) echo 'editions=["dsh-plugin-desktop","dsh-plugin-desktop-beta"]' >> "$GITHUB_OUTPUT" ;;
          esac

  windows:
    needs: target
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        workspace: ${{ fromJSON(needs.target.outputs.editions) }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
      - run: corepack enable
      - name: Resolve Yarn cache folder
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> "$env:GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: yarn-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('yarn.lock', '.yarnrc.yml') }}
      - run: yarn install --immutable
      - name: Windows package gate
        run: yarn workspace ${{ matrix.workspace }} check:win-package
      - name: Build Windows installer
        env:
          DSH_PACKAGE_CHECK_ALREADY_RAN: '1'
        run: yarn workspace ${{ matrix.workspace }} dist:win
      - name: Build Windows portable archive
        env:
          DSH_PACKAGE_CHECK_ALREADY_RAN: '1'
        run: yarn workspace ${{ matrix.workspace }} dist:win-portable
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.workspace }}-windows
          if-no-files-found: error
          path: |
            ${{ matrix.workspace }}/dist/*-Setup.exe
            ${{ matrix.workspace }}/dist/*-Portable.zip

  macos:
    needs: target
    runs-on: macos-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        workspace: ${{ fromJSON(needs.target.outputs.editions) }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
      - run: corepack enable
      - name: Resolve Yarn cache folder
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: yarn-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('yarn.lock', '.yarnrc.yml') }}
      - run: yarn install --immutable
      - name: macOS package gate
        run: yarn workspace ${{ matrix.workspace }} check:mac-package
      - name: Build unsigned macOS DMG
        # Signing and notarization stay on a credentialed machine; this asset is
        # an unsigned smoke DMG for the release page and updater plumbing.
        env:
          DSH_PACKAGE_CHECK_ALREADY_RAN: '1'
        run: yarn workspace ${{ matrix.workspace }} dist:mac-smoke
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.workspace }}-macos
          if-no-files-found: error
          path: ${{ matrix.workspace }}/dist/mac-smoke/**/*.dmg

  publish:
    if: github.repository == 'TypeDreamMoon/dsh-desktop' && startsWith(github.ref, 'refs/tags/')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          if ! gh release view "$TAG" -R "$repo" >/dev/null 2>&1; then
            gh release create "$TAG" -R "$repo" --title "$TAG" --generate-notes
          fi
          find release-assets -type f -print0 | xargs -0 --no-run-if-empty gh release upload "$TAG" -R "$repo" --clobber

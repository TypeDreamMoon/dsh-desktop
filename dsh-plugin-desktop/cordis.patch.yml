# Desktop Host operations compose around the existing Web bundle. Compatibility
# mode keeps upstream ownership of the browser carrier and rendered UI.
- insert:
    - id: desktop-shell
      name: dsh-plugin-desktop
      config:
        mode: compatibility
    - id: desktop-terminal
      name: dsh-plugin-desktop/terminal
      disabled: !!js process.platform === 'linux'
    - id: desktop-diagnostics
      name: dsh-plugin-desktop/diagnostics
    - id: desktop-notifications
      name: dsh-plugin-desktop/notifications
    - id: desktop-pnpm
      name: dsh-plugin-desktop/pnpm
    - id: desktop-profiles
      name: dsh-plugin-desktop/profiles
    - id: desktop-updates
      name: dsh-plugin-desktop/updates
      config:
        # fork = TypeDreamMoon/dsh-desktop Releases (this repository),
        # upstream = anywhere-labs/dsh-desktop Releases,
        # official = the DSH Desktop release service,
        # github:<owner>/<repo> = any other repository.
        releaseSource: fork
        # auto follows the installed edition's own stream. Set stable or
        # beta to pin the stream; a machine-wide cordis.patch.yml in the DSH
        # home may override this row without rebuilding.
        releaseChannel: auto

# A desktop launch has no terminal operator waiting for the Web readiness line.
- id: web-runtime
  config:
    openBrowser: false
    printUrl: false
    surfaceContext: true
    trustedHosts: []
